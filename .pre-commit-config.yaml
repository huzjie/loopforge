# LoopForge pre-commit 钩子
# 安装： pre-commit install
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/.*\.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--strict, --config-file=pyproject.toml]
        files: ^src/loopforge/(core|db|models|schemas)/
        additional_dependencies:
          - pydantic==2.10.4
          - pydantic-settings==2.7.0
          - SQLAlchemy==2.0.36
          - types-PyYAML==6.0.12.20241230
          - structlog==24.4.0

  - repo: local
    hooks:
      - id: forbid-direct-now
        name: 禁止直接调用 datetime.now() / time.time()（必须走 core.clock.Clock）
        entry: python scripts/check_clock_usage.py
        language: system
        pass_filenames: true
        files: ^src/loopforge/.*\.py$
        exclude: ^src/loopforge/core/clock\.py$

      - id: forbid-single-alembic-head
        name: alembic heads 必须恰好一行
        entry: python scripts/check_alembic_heads.py
        language: system
        pass_filenames: false
        files: ^alembic/versions/.*\.py$
