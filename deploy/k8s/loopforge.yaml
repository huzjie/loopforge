apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopforge
  labels:
    app: loopforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loopforge
  template:
    metadata:
      labels:
        app: loopforge
    spec:
      containers:
        - name: loopforge
          image: loopforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8431
          readinessProbe:
            httpGet:
              path: /health
              port: 8431
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loopforge
spec:
  selector:
    app: loopforge
  ports:
    - port: 8431
      targetPort: 8431
  type: ClusterIP
