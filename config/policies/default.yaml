# ============================================================================
# LoopForge 默认安全策略（WP5 · 治理层）
#
# 规则语义（ARCHITECTURE §7.5 / TASK_BREAKDOWN §7.3.2 G1）：
#   - 判定顺序严格短路：deny > require_approval > allow；先命中 deny 立即返回。
#   - 未命中任何规则 → 默认拒绝（R-DEFAULT-DENY）。
#   - 规则按 order 升序求值。
# ============================================================================
name: default
version: 1
description: 默认安全基线 —— 危险命令 / 路径沙箱 / 网络白名单 / 密钥泄露 / git 保护

rules:
  # ------------------------------------------------------------------ shell
  - rule_id: R-SHELL-001
    category: shell
    match: {}
    effect: DENY
    order: 10
    reason: 危险命令（删除/格式化/提权/反弹 shell/下载执行等）
    severity: CRITICAL

  - rule_id: R-SHELL-002
    category: shell
    match: { pattern: "rm -rf /" }
    effect: DENY
    order: 11
    reason: 禁止删除根目录
    severity: CRITICAL

  - rule_id: R-SHELL-003
    category: shell
    match: { pattern: "curl\\s+.*\\|\\s*(sh|bash)" }
    effect: DENY
    order: 12
    reason: 禁止 curl 管道到 shell（下载即执行）
    severity: CRITICAL

  - rule_id: R-SHELL-004
    category: shell
    match: { pattern: "base64\\s+-d" }
    effect: DENY
    order: 13
    reason: 禁止 base64 解码执行（混淆绕过）
    severity: CRITICAL

  - rule_id: R-SHELL-005
    category: shell
    match: { pattern: "\\$\\(|`" }
    effect: REQUIRE_APPROVAL
    order: 14
    reason: 命令替换属于高风险语法，需人工审批
    severity: WARNING

  # ------------------------------------------------------------------ path
  - rule_id: R-PATH-001
    category: path
    match: { deny: ["/etc/passwd", "/etc/shadow", "/etc/sudoers"] }
    effect: DENY
    order: 20
    reason: 禁止读写系统敏感文件
    severity: CRITICAL

  - rule_id: R-PATH-002
    category: path
    match: { deny: ["/dev/sda*", "/dev/sdb*", "/dev/mem", "/dev/kmem"] }
    effect: DENY
    order: 21
    reason: 禁止直接操作块设备/内存设备
    severity: CRITICAL

  - rule_id: R-PATH-003
    category: path
    match: { deny: ["/proc/kcore", "/proc/sys/**", "/boot/**"] }
    effect: DENY
    order: 22
    reason: 禁止访问内核关键路径
    severity: CRITICAL

  - rule_id: R-PATH-004
    category: path
    match: { deny: ["**/.git/config", "**/.git/objects/**"] }
    effect: DENY
    order: 23
    reason: 禁止读写 .git 内部对象（防篡改仓库）
    severity: WARNING

  - rule_id: R-PATH-005
    category: path
    match: { allow: ["**/workspace/**", "**/src/**", "**/tests/**", "**/data/**"] }
    effect: ALLOW
    order: 24
    reason: 工作区/源码/测试/数据目录允许读写
    severity: INFO

  # ---------------------------------------------------------------- network
  - rule_id: R-NET-001
    category: network
    match:
      allow_domains:
        - pypi.org
        - files.pythonhosted.org
        - github.com
        - api.github.com
        - raw.githubusercontent.com
        - codeload.github.com
        - objects.githubusercontent.com
        - registry.npmjs.org
        - registry.yarnpkg.com
        - proxy.golang.org
        - repo.maven.apache.org
      allow_private: false
    effect: DENY
    order: 30
    reason: 域名不在白名单或访问私网地址（防 SSRF）
    severity: WARNING

  - rule_id: R-NET-002
    category: network
    match: { deny_domains: ["pastebin.com", "transfer.sh", "0x0.st", "termbin.com"] }
    effect: DENY
    order: 31
    reason: 禁止数据外传至公共粘贴/文件站
    severity: CRITICAL

  - rule_id: R-NET-003
    category: network
    match:
      allow_domains:
        - pypi.org
        - files.pythonhosted.org
        - github.com
        - api.github.com
        - raw.githubusercontent.com
        - codeload.github.com
        - objects.githubusercontent.com
        - registry.npmjs.org
        - registry.yarnpkg.com
        - proxy.golang.org
        - repo.maven.apache.org
      allow_private: false
    effect: ALLOW
    order: 32
    reason: 白名单域允许访问
    severity: INFO

  # ------------------------------------------------------------------- git
  - rule_id: R-GIT-001
    category: git
    match: { protected_branches: ["main", "master", "release/*", "develop"] }
    effect: DENY
    order: 40
    reason: 禁止直接写入受保护分支
    severity: WARNING

  - rule_id: R-GIT-002
    category: git
    match: { protected_branches: ["main", "master"] }
    effect: REQUIRE_APPROVAL
    order: 41
    reason: 向主干分支推送需人工审批
    severity: WARNING

  - rule_id: R-GIT-003
    category: shell
    match: { pattern: "git\\s+push\\s+.*--force" }
    effect: REQUIRE_APPROVAL
    order: 42
    reason: 强制推送会改写历史，需人工审批
    severity: WARNING

  - rule_id: R-GIT-004
    category: shell
    match: { pattern: "git\\s+(reset\\s+--hard|clean\\s+-f)" }
    effect: DENY
    order: 43
    reason: 禁止危险 git 重置/清理
    severity: CRITICAL

  - rule_id: R-GIT-005
    category: git
    match: { protected_branches: ["main", "master", "release/*", "develop"] }
    effect: ALLOW
    order: 44
    reason: 非受保护分支允许 git 操作
    severity: INFO

  # ---------------------------------------------------------------- secret
  - rule_id: R-SECRET-001
    category: secret
    match: {}
    effect: DENY
    order: 50
    reason: 检测到密钥/令牌泄露（AWS/GCP/GitHub/Slack/Stripe/私钥等）
    severity: CRITICAL

  # ------------------------------------------------------------ dependency
  - rule_id: R-DEP-001
    category: dependency
    match: {}
    effect: DENY
    order: 60
    reason: 高危依赖名或危险版本（防 typosquatting）
    severity: WARNING

  # ------------------------------------------------------------------ tool
  - rule_id: R-TOOL-001
    category: tool
    match: { tool_names: ["read_file", "list_dir", "search_code", "run_tests"] }
    effect: ALLOW
    order: 70
    reason: 只读工具默认放行
    severity: INFO

  - rule_id: R-TOOL-002
    category: tool
    match: { tool_name: "run_shell" }
    effect: REQUIRE_APPROVAL
    order: 71
    reason: 高危 shell 工具统一走审批（除 R-SHELL 明确拒绝外）
    severity: WARNING
