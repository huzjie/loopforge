# LoopForge 模型价目表
#
# 单位：每 100 万 tokens 的价格（per M tokens）。
# currency 缺省为 USD；写 CNY 时由 providers/pricing.py 按 fx 表折算成 USD。
#
# 字段说明
#   input          输入（未命中缓存部分）单价
#   output         输出单价
#   cached_input   命中前缀缓存的输入单价，缺省视为 input
#   context        上下文窗口（tokens）
#   max_output     单次输出上限（tokens）
#
# 匹配顺序（providers/pricing.py::price_of）
#   1. provider + 精确模型名
#   2. provider + 最长前缀匹配（覆盖 qwen3.8-max-2026-08-01 这类带日期后缀的快照名）
#   3. provider 下的 "*" 通配
#   4. 抛 ModelNotPricedError
#
# 免责声明：价格随厂商调整而变动，本文件只是缺省值。
# 生产部署请通过 providers.pricing_file 指向自己维护的副本。

version: 1
updated_at: "2026-08-03"

# 外汇折算表：1 USD = ? 该币种。仅用于把 CNY 价目折成 USD 记账。
fx:
  USD: 1.0
  CNY: 7.20

providers:

  # ---------------------------------------------------------------- Mock
  # 合成价格，专供零 Key 端到端演练：数量级刻意贴近真实中端模型，
  # 这样预算三级动作（warn / throttle / halt）在 mock 模式下也能被真实触发。
  mock:
    mock-large:
      input: 0.50
      output: 1.50
      cached_input: 0.05
      context: 131072
      max_output: 16384
    mock-small:
      input: 0.10
      output: 0.30
      cached_input: 0.01
      context: 32768
      max_output: 4096
    "*":
      input: 0.50
      output: 1.50
      cached_input: 0.05
      context: 131072
      max_output: 16384

  # ---------------------------------------------------------------- DashScope（阿里云百炼 / 通义千问）
