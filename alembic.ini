# LoopForge Alembic configuration.
#
# NOTE: this file MUST stay pure ASCII. Python 3.13's configparser reads ini
# files with encoding="locale", which is GBK/CP1252 on many Windows installs --
# any non-ASCII byte here makes `alembic upgrade head` die with a
# UnicodeDecodeError before a single line of our code runs. Chinese
# documentation for the migration chain lives in alembic/env.py instead.
#
# The 0001 -> 0006 chain is owned by the WP1 owner. --autogenerate is banned:
# every migration is hand written and must pass on both SQLite and PostgreSQL.

[alembic]
script_location = alembic
prepend_sys_path = . src
path_separator = os
version_path_separator = os
version_locations = %(here)s/alembic/versions

# The real runtime URL comes from loopforge.core.config.get_settings().db.url
# (resolved in alembic/env.py). The value below is only a CLI fallback.
sqlalchemy.url = sqlite+aiosqlite:///./data/loopforge.db

# Migration filename template. Revision ids (0001, 0002, ...) are assigned by
# hand so that the chain reads in order on disk.
file_template = %%(rev)s_%%(slug)s

truncate_slug_length = 60

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
