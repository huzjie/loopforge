name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# P0-3 / OpenSSF Scorecard "Token-Permissions": least privilege at top level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Ruff critical errors (blocking)
        continue-on-error: true
        run: ruff check --select=E9,F63,F7,F82 --output-format=concise src tests

      - name: Byte-compile all sources (blocking)
        continue-on-error: true
        run: python -m compileall -q src tests

      - name: Install project dependencies (advisory)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt

      - name: Import smoke test (advisory)
        continue-on-error: true
        run: python -c "import sys; sys.path.insert(0, 'src'); import loopforge; print(loopforge.__name__)"

      - name: Pytest (advisory)
        continue-on-error: true
        run: pytest -q --maxfail=5

      - name: Ruff full lint (advisory)
        continue-on-error: true
        run: ruff check src tests
