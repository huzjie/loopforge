[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.1.0"
description = "LoopForge — 开源、自托管、模型无关的长程自主编程智能体编排与治理平台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LoopForge Contributors" }]
keywords = ["agent", "orchestration", "llm", "autonomous", "loop-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "starlette==0.41.3",
    "python-multipart==0.0.20",
    "websockets==14.1",
    "sse-starlette==2.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    "httpx==0.28.1",
    "typer==0.15.1",
    "rich==13.9.4",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "cryptography==50.0.0",
    "PyYAML==6.0.2",
    "jinja2==3.1.5",
]

[project.optional-dependencies]
docker = ["docker==7.1.0"]
tokens = ["tiktoken==0.8.0"]
vector = ["numpy==2.2.1"]
postgres = ["asyncpg==0.30.0"]
all = ["loopforge[docker,tokens,vector,postgres]"]

[project.scripts]
loopforge = "loopforge.__main__:main"

[project.urls]
Homepage = "https://github.com/loopforge/loopforge"
Documentation = "https://github.com/loopforge/loopforge/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["loopforge*"]

[tool.setuptools.package-data]
loopforge = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff specific
    "ASYNC",
]
ignore = [
    "E501",   # 行长由 formatter 负责
    "B008",   # FastAPI Depends() 默认值惯用法
    "RUF001", # 中文全角标点
    "RUF002",
    "RUF003",
    "N818",   # 异常名不强制 Error 后缀（LoopForgeError 体系自洽）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "SIM117"]
"alembic/**" = ["I001", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["loopforge"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
disallow_untyped_defs = false
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
module = ["yaml.*", "structlog.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: 耗时较长的测试",
    "integration: 需要外部依赖的集成测试",
    "postgres: 需要 PostgreSQL 的测试",
]
filterwarnings = [
    "error::DeprecationWarning:loopforge.*",
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["src/loopforge"]
omit = ["*/__main__.py", "*/alembic/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]
