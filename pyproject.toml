[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopforge"
version = "0.1.0"
description = "Loop-forge: a zero-dependency reference implementation of SenseNova Loop-style Looped Transformers with Manifold-Constrained Hyper-Connections (mHC). Weight-tied recurrent blocks that trade compute for depth (32 layers -> 56 effective layers), multi-stream hyper-connections constrained on a manifold for signal-propagation stability, and a reproducible power-iteration convergence benchmark. Pure Python, no numpy/torch/requests."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loopforge contributors" }]
keywords = ["looped-transformer", "weight-tying", "recurrent-depth", "hyper-connections", "manifold-constrained", "compute-for-params", "mhc", "efficient-transformers", "signal-propagation", "zero-dependency", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
loopforge = "loopforge.cli:main"

[tool.setuptools.packages.find]
include = ["loopforge*"]
